<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results — DealBridge</title>
    <meta name="description" content="Search for the best deals across all our partners.">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        .layout-sidebar-main { display: grid; grid-template-columns: 250px 1fr; gap: var(--spacing-xl); align-items: start; margin-top: var(--spacing-lg); margin-bottom: var(--spacing-3xl); }
        .filter-sidebar { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--spacing-md); }
        .filter-section { margin-bottom: var(--spacing-lg); }
        .filter-section:last-child { margin-bottom: 0; }
        .filter-section h3 { margin-top: 0; margin-bottom: var(--spacing-sm); font-size: 1.1rem; }
        .filter-list { list-style: none; padding: 0; margin: 0; }
        .filter-list li { margin-bottom: var(--spacing-xs); }
        .filter-list label { display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer; }
        .price-inputs { display: flex; gap: var(--spacing-sm); align-items: center; }
        .price-inputs input { width: 100px; padding: var(--spacing-xs); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text); }
        
        .sort-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg); padding-bottom: var(--spacing-sm); border-bottom: 1px solid var(--color-border); }
        .sort-select { padding: var(--spacing-xs) var(--spacing-sm); border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-family: inherit; background: var(--color-surface); color: var(--color-text); }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--spacing-lg); }
        
        .mobile-filter-toggle { display: none; margin-bottom: var(--spacing-md); width: 100%; }
        
        @media (max-width: 768px) {
            .layout-sidebar-main { grid-template-columns: 1fr; }
            .mobile-filter-toggle { display: block; }
            .filter-sidebar { display: none; }
            .filter-sidebar.active { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; overflow-y: auto; border-radius: 0; }
            .filter-sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md); }
            .filter-sidebar-header h2 { margin: 0; }
            .filter-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        }
    </style>
</head>
<body>
    <header id="app-header"></header>
    <main class="container">
        <nav class="breadcrumb" style="margin-top: var(--spacing-md); color: var(--color-text-secondary); font-size: 0.9rem;">
            <a href="/" class="text-link">Home</a> &gt; Search &gt; <span id="breadcrumb-query"></span>
        </nav>
        
        <div class="page-header" style="margin-top: var(--spacing-md);">
            <h1 style="margin-bottom: var(--spacing-xs);">Search Results for "<span id="page-title-query"></span>"</h1>
            <p id="search-count" style="color: var(--color-text-secondary); margin: 0;">0 results found</p>
        </div>
        
        <div class="layout-sidebar-main">
            <button class="btn btn-outline mobile-filter-toggle" id="filter-toggle-btn">Filters & Sort</button>
            
            <aside class="filter-sidebar" id="filter-sidebar">
                <div class="filter-sidebar-header" style="display: none;">
                    <h2>Filters</h2>
                    <button class="filter-close" id="filter-close-btn">&times;</button>
                </div>
                
                <form id="filter-form">
                    <div class="filter-section">
                        <h3>Categories</h3>
                        <ul class="filter-list" id="filter-categories"></ul>
                    </div>
                    
                    <div class="filter-section">
                        <h3>Brands</h3>
                        <ul class="filter-list" id="filter-brands"></ul>
                    </div>
                    
                    <div class="filter-section">
                        <h3>Price Range</h3>
                        <div class="price-inputs">
                            <input type="number" id="price-min" placeholder="Min ₹" min="0">
                            <span>-</span>
                            <input type="number" id="price-max" placeholder="Max ₹" min="0">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full" style="margin-top: var(--spacing-md);">Apply Filters</button>
                </form>
            </aside>
            
            <div class="main-content">
                <div class="sort-bar">
                    <span id="result-count-label">Showing results</span>
                    <div>
                        <label for="sort-select">Sort by:</label>
                        <select id="sort-select" class="sort-select">
                            <option value="relevance">Relevance</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="rating">Highest Rated</option>
                        </select>
                    </div>
                </div>
                
                <div id="search-results" class="product-grid">
                    <!-- Products rendered here -->
                </div>
            </div>
        </div>
    </main>
    <footer id="app-footer"></footer>
    <script type="module" src="/js/pages/search.js?v=2.0"></script>
</body>
</html>
