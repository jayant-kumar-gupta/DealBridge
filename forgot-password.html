<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — DealBridge</title>
    <meta name="description" content="Reset your DealBridge account password.">
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <header id="app-header"></header>
    <main class="auth-page">
        <div class="auth-card card">
            <div class="auth-card__logo" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: var(--space-lg);">
                <img src="/assets/images/logo.jpg" alt="DealBridge Logo" width="36" height="36" style="border-radius: 8px;">
                <span style="font-size: var(--font-size-2xl); font-weight: bold; color: var(--color-text);">DealBridge</span>
            </div>
            <h1 class="auth-card__title">Forgot Password</h1>
            <p class="auth-card__subtitle">Enter your email address and we'll send you a password reset link.</p>
            <form id="forgot-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your registered email" required autocomplete="email">
                </div>
                <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: var(--space-md);">Send Reset Link</button>
            </form>
            <div class="auth-divider"></div>
            <div class="auth-card__footer">
                Remembered your password? <a href="/login.html" style="color: var(--color-primary); font-weight: 500;">Back to login</a>
            </div>
        </div>
    </main>
    <footer id="app-footer"></footer>
    <script type="module" src="/js/pages/auth-page.js"></script>
</body>
</html>
