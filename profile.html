<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — DealBridge</title>
    <meta name="description" content="Manage your DealBridge profile.">
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        #edit-profile-btn {
            min-height: 44px;
            padding: 0 var(--spacing-md);
            border: 1px solid #000;
            border-radius: var(--radius-md);
            background: #fff;
            color: #000;
            font: inherit;
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: background-color var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
        }

        #edit-profile-btn:hover {
            background: #f1f1f1;
        }

        [data-theme="dark"] #edit-profile-btn {
            border-color: #fff;
            background: #000;
            color: #fff;
        }

        [data-theme="dark"] #edit-profile-btn:hover {
            background: #1f1f1f;
        }

        #profile-form .form-group {
            margin-bottom: var(--spacing-md);
        }

        #profile-form label {
            display: block;
            margin-bottom: var(--spacing-xs);
            color: var(--color-text);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
        }

        #profile-form .input {
            width: 100%;
            min-height: 44px;
            padding: 0 var(--spacing-sm);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-bg);
            color: var(--color-text);
            font: inherit;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background-color var(--transition-fast);
        }

        #profile-form .input:hover {
            border-color: var(--color-border-hover);
        }

        #profile-form .input:focus {
            border-color: var(--color-primary);
            outline: none;
            box-shadow: 0 0 0 3px var(--color-primary-light);
        }

        #profile-form .profile-action-button {
            min-height: 44px;
            padding: 0 var(--spacing-md);
            border: 1px solid var(--color-primary);
            border-radius: var(--radius-md);
            font: inherit;
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: background-color var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
        }

        #profile-form .profile-action-button--primary {
            background: var(--color-primary);
            color: #fff;
        }

        #profile-form .profile-action-button--primary:hover {
            background: var(--color-primary-dark);
            border-color: var(--color-primary-dark);
        }

        #profile-form .profile-action-button--outline {
            background: #fff;
            color: #000;
            border-color: #000;
        }

        #profile-form .profile-action-button--outline:hover {
            background: #f1f1f1;
        }

        [data-theme="dark"] #profile-form .profile-action-button--outline {
            background: #000;
            color: #fff;
            border-color: #fff;
        }

        [data-theme="dark"] #profile-form .profile-action-button--outline:hover {
            background: #1f1f1f;
        }
    </style>
</head>
<body>
    <header id="app-header"></header>
    <main class="sidebar-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li class="sidebar-nav__item"><a href="/profile.html" class="active">👤 Profile</a></li>
                    <li class="sidebar-nav__item"><a href="/orders.html">📦 Orders</a></li>
                    <li class="sidebar-nav__item"><a href="/wishlist.html">❤️ Wishlist</a></li>
                    <li class="sidebar-nav__item"><a href="/addresses.html">📍 Addresses</a></li>
                    <li class="sidebar-nav__item"><a href="#" id="logout-btn">🚪 Logout</a></li>
                </ul>
            </nav>
        </aside>
        <div class="dashboard-content">
            <section class="profile-header card">
                <div style="display: flex; align-items: center; gap: var(--spacing-lg);">
                    <div class="profile-avatar" id="profile-avatar"></div>
                    <div class="profile-info">
                        <h1 id="profile-name" style="margin-bottom: var(--spacing-xs);"></h1>
                        <p id="profile-email" style="color: var(--color-text-secondary); margin-bottom: var(--spacing-xs);"></p>
                        <p id="profile-phone" style="color: var(--color-text-secondary); margin-bottom: var(--spacing-xs);"></p>
                        <p style="font-size: 0.9rem; color: var(--color-text-secondary);">Member since: <span id="profile-date"></span></p>
                    </div>
                </div>
                <button id="edit-profile-btn" style="margin-top: var(--spacing-md);">Edit Profile</button>
            </section>

            <section id="edit-profile-form" class="card" style="display: none; margin-top: var(--spacing-lg);">
                <h2>Edit Profile</h2>
                <form class="form" id="profile-form" style="margin-top: var(--spacing-md);">
                    <div class="form-group">
                        <label for="edit-name">Full Name</label>
                        <input type="text" id="edit-name" class="input" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-email">Email Address</label>
                        <input type="email" id="edit-email" class="input" required>
                    </div>
                    <div class="form-group">
                        <label for="edit-phone">Phone Number</label>
                        <input type="tel" id="edit-phone" class="input" required>
                    </div>
                    <div style="display: flex; gap: var(--spacing-sm); margin-top: var(--spacing-md);">
                        <button type="submit" class="profile-action-button profile-action-button--primary">Save Changes</button>
                        <button type="button" class="profile-action-button profile-action-button--outline" id="cancel-edit-btn">Cancel</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
    <footer id="app-footer"></footer>
    <script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
