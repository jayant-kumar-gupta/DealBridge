<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist — DealBridge</title>
    <meta name="description" content="View your saved items.">
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        .wishlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--spacing-lg); }
        .wishlist-card { position: relative; display: flex; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }
        .wishlist-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .remove-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--color-error); font-size: 1.2rem; box-shadow: var(--shadow-sm); z-index: 2; }
    </style>
</head>
<body>
    <header id="app-header"></header>
    <main class="sidebar-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li class="sidebar-nav__item"><a href="/profile.html">👤 Profile</a></li>
                    <li class="sidebar-nav__item"><a href="/orders.html">📦 Orders</a></li>
                    <li class="sidebar-nav__item"><a href="/wishlist.html" class="active">❤️ Wishlist</a></li>
                    <li class="sidebar-nav__item"><a href="/addresses.html">📍 Addresses</a></li>
                    <li class="sidebar-nav__item"><a href="/promo-codes.html">🎟️ Promo Codes</a></li>
                    <li class="sidebar-nav__item"><a href="/notifications.html">🔔 Notifications</a></li>
                    <li class="sidebar-nav__item"><a href="#" id="logout-btn">🚪 Logout</a></li>
                </ul>
            </nav>
        </aside>
        <div class="dashboard-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
                <h1>My Wishlist (<span id="wishlist-count">0</span>)</h1>
            </div>
            
            <div id="wishlist-grid" class="wishlist-grid">
                <!-- Populated by JS -->
            </div>
            
            <div id="empty-state" class="empty-state" style="display: none; text-align: center; padding: var(--spacing-3xl) 0;">
                <div style="font-size: 4rem; color: var(--color-text-secondary); margin-bottom: var(--spacing-md);">❤️</div>
                <h3>Your wishlist is empty</h3>
                <p style="color: var(--color-text-secondary); margin-bottom: var(--spacing-lg);">Save items you like to view them later.</p>
                <a href="/" class="btn btn--primary">Discover Deals</a>
            </div>
        </div>
    </main>
    <footer id="app-footer"></footer>
    <script type="module" src="/js/pages/wishlist-page.js"></script>
</body>
</html>
