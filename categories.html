<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Categories — DealBridge</title>
    <meta name="description" content="Explore all product categories and departments across DealBridge.">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        .categories-hero {
            padding: var(--space-2xl) 0 var(--space-xl);
            border-bottom: 1px solid var(--color-border);
            margin-bottom: var(--space-xl);
            background: linear-gradient(135deg, var(--color-surface), var(--color-bg));
        }

        .categories-controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
            flex-wrap: wrap;
        }

        .categories-search-box {
            position: relative;
            flex: 1;
            max-width: 360px;
            min-width: 240px;
        }

        .categories-search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-surface);
            color: var(--color-text);
            font-size: var(--font-size-sm);
        }

        .categories-search-box .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-secondary);
            pointer-events: none;
            font-size: 0.9rem;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: var(--space-lg);
            min-height: 280px;
        }

        .category-item-card {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl) var(--space-md);
            text-align: center;
            text-decoration: none;
            color: var(--color-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
        }

        .category-item-card:hover {
            transform: translateY(-3px);
            border-color: var(--color-primary);
            box-shadow: var(--shadow-md);
        }

        .category-item-icon {
            font-size: 2.75rem;
            line-height: 1;
            margin-bottom: var(--space-xs);
        }

        .category-item-name {
            font-weight: 600;
            font-size: var(--font-size-base);
            color: var(--color-text);
            margin: 0;
            word-break: break-word;
        }

        .category-item-desc {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        /* Pagination Controls */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: var(--space-3xl);
            margin-bottom: var(--space-3xl);
            flex-wrap: wrap;
        }

        .pagination-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-surface);
            color: var(--color-text);
            font-size: var(--font-size-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-decoration: none;
            user-select: none;
        }

        .pagination-btn:hover:not(:disabled):not(.active) {
            border-color: var(--color-primary);
            color: var(--color-primary);
            background: var(--color-surface-hover);
        }

        .pagination-btn.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #ffffff;
            font-weight: 600;
            cursor: default;
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: var(--color-surface-hover);
        }

        .pagination-ellipsis {
            padding: 0 6px;
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
        }

        .categories-empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: var(--space-3xl) var(--space-lg);
            background: var(--color-surface);
            border: 1px dashed var(--color-border);
            border-radius: var(--radius-lg);
        }
    </style>
</head>
<body>
    <header id="app-header"></header>

    <main>
        <section class="categories-hero">
            <div class="container">
                <nav class="breadcrumb" style="margin-bottom: var(--space-sm); font-size: var(--font-size-sm); color: var(--color-text-secondary);">
                    <a href="/" class="text-link" style="color: var(--color-text-secondary);">Home</a> &gt; <span>Categories</span>
                </nav>
                <h1 style="margin: 0 0 var(--space-xs); font-size: 2.25rem;">All Categories</h1>
                <p style="margin: 0; color: var(--color-text-secondary); font-size: var(--font-size-base); max-width: 600px;">
                    Explore our extensive catalog of curated departments, product niches, and categories.
                </p>
            </div>
        </section>

        <section class="section" style="padding-top: 0;">
            <div class="container">
                <!-- Controls Bar -->
                <div class="categories-controls-bar">
                    <div style="display: flex; gap: var(--space-md); align-items: center; flex-wrap: wrap; flex: 1;">
                        <div class="categories-search-box">
                            <span class="search-icon">🔍</span>
                            <input type="search" id="category-search" placeholder="Search across all categories...">
                        </div>
                        <div style="display: flex; align-items: center; gap: var(--space-xs);">
                            <label for="category-sort" style="font-size: var(--font-size-sm); color: var(--color-text-secondary); white-space: nowrap;">Sort by:</label>
                            <select id="category-sort" class="form-input" style="padding: 8px 12px; font-size: var(--font-size-sm); cursor: pointer;">
                                <option value="name-asc">Name (A – Z)</option>
                                <option value="name-desc">Name (Z – A)</option>
                                <option value="id-asc">ID (Low to High)</option>
                                <option value="id-desc">ID (High to Low)</option>
                            </select>
                        </div>
                    </div>
                    <div id="categories-count-indicator" style="font-size: var(--font-size-sm); color: var(--color-text-secondary); font-weight: 500;">
                        Loading categories...
                    </div>
                </div>

                <!-- Categories Grid -->
                <div id="categories-grid" class="categories-grid">
                    <!-- Populated by JS -->
                </div>

                <!-- Dynamic Pagination -->
                <div id="pagination-container" class="pagination-container">
                    <!-- Populated by JS -->
                </div>
            </div>
        </section>
    </main>

    <footer id="app-footer"></footer>
    <script type="module" src="/js/pages/categories-page.js"></script>
</body>
</html>
