<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category — DealBridge</title>
    <meta name="description" content="Shop the best deals by category.">
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <style>
        .category-hero { padding: var(--spacing-2xl) 0; background: var(--color-primary-light); margin-bottom: var(--spacing-xl); text-align: center; }
        .category-hero .icon { font-size: 3rem; margin-bottom: var(--spacing-sm); }
        .category-hero h1 { margin: 0 0 var(--spacing-xs) 0; color: var(--color-primary-dark); }
        [data-theme="dark"] .category-hero h1 { color: #ffffff; }
        .category-hero p { margin: 0; color: var(--color-text-secondary); max-width: 600px; margin: 0 auto; }
        
        .layout-sidebar-main { display: grid; grid-template-columns: 250px 1fr; gap: var(--spacing-xl); align-items: start; margin-bottom: var(--spacing-3xl); }
        .filter-sidebar { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--spacing-md); }
        .filter-section { margin-bottom: var(--spacing-lg); }
        .filter-section:last-child { margin-bottom: 0; }
        .filter-section h3 { margin-top: 0; margin-bottom: var(--spacing-sm); font-size: 1.1rem; }
        .filter-list { list-style: none; padding: 0; margin: 0; }
        .filter-list li { margin-bottom: var(--spacing-xs); }
        .filter-list label { display: flex; align-items: center; gap: var(--spacing-sm); cursor: pointer; }
        .price-inputs { display: flex; gap: var(--spacing-sm); align-items: center; }
        .price-inputs input { width: 100px; padding: var(--spacing-xs); border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text); }
        
        .sort-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg); padding-bottom: var(--spacing-sm); border-bottom: 1px solid var(--color-border); }
        .sort-select { padding: var(--spacing-xs) var(--spacing-sm); border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-family: inherit; background: var(--color-surface); color: var(--color-text); cursor: pointer; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: var(--spacing-lg); min-height: 250px; }
        
        /* Pagination Controls */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: var(--space-2xl);
            margin-bottom: var(--space-xl);
            flex-wrap: wrap;
        }
        .pagination-btn {
            min-width: 38px;
            height: 38px;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background: var(--color-surface);
            color: var(--color-text);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            text-decoration: none;
            user-select: none;
        }
        .pagination-btn:hover:not(:disabled):not(.active) {
            border-color: var(--color-primary);
            color: var(--color-primary);
            background: var(--color-surface-hover);
        }
        .pagination-btn.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #ffffff;
            font-weight: 600;
            cursor: default;
        }
        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: var(--color-surface-hover);
        }
        .pagination-ellipsis {
            padding: 0 6px;
            color: var(--color-text-secondary);
            font-size: 0.88rem;
        }

        .mobile-filter-toggle { display: none; margin-bottom: var(--spacing-md); width: 100%; }
        
        @media (max-width: 768px) {
            .layout-sidebar-main { grid-template-columns: 1fr; }
            .mobile-filter-toggle { display: block; }
            .filter-sidebar { display: none; }
            .filter-sidebar.active { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; overflow-y: auto; border-radius: 0; }
            .filter-sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md); }
            .filter-sidebar-header h2 { margin: 0; }
            .filter-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        }
    </style>
</head>
<body>
    <header id="app-header"></header>
    
    <div class="category-hero">
        <div class="container">
            <div id="category-icon" class="icon">📁</div>
            <h1 id="category-title">Category</h1>
            <p id="category-desc">Loading...</p>
        </div>
    </div>
    
    <main class="container">
        <nav class="breadcrumb" style="margin-bottom: var(--spacing-lg); color: var(--color-text-secondary); font-size: 0.9rem;">
            <a href="/" class="text-link">Home</a> &gt; <a href="/categories.html" class="text-link">Categories</a> &gt; <span id="breadcrumb-name">...</span>
        </nav>
        
        <div class="layout-sidebar-main">
            <button class="btn btn-outline mobile-filter-toggle" id="filter-toggle-btn">Filters & Sort</button>
            
            <aside class="filter-sidebar" id="filter-sidebar">
                <div class="filter-sidebar-header" style="display: none;">
                    <h2>Filters</h2>
                    <button class="filter-close" id="filter-close-btn">&times;</button>
                </div>
                
                <form id="filter-form">
                    <div class="filter-section">
                        <h3 style="margin-top: 0; margin-bottom: var(--spacing-sm); font-size: 1.1rem;">Offers & Deals</h3>
                        <ul class="filter-list">
                            <li>
                                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 8px; background: var(--color-surface-hover); border-radius: var(--radius-sm); border: 1px solid var(--color-border);">
                                    <input type="checkbox" id="category-deals-only" name="deals_only">
                                    <span style="font-weight: 600; color: var(--color-primary); font-size: 0.88rem;">🔥 Discounted Deals Only</span>
                                </label>
                            </li>
                        </ul>
                    </div>

                    <div class="filter-section">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-sm);">
                            <h3 style="margin: 0; font-size: 1.1rem;">Brands</h3>
                            <button type="button" id="clear-brands-btn" style="background: none; border: none; color: var(--color-primary); font-size: 0.8rem; cursor: pointer; display: none;">Clear</button>
                        </div>
                        <ul class="filter-list" id="filter-brands" style="max-height: 220px; overflow-y: auto;"></ul>
                    </div>
                    
                    <div class="filter-section">
                        <h3 style="margin-top: 0; margin-bottom: var(--spacing-sm); font-size: 1.1rem;">Price Range</h3>
                        <div class="price-inputs">
                            <input type="number" id="price-min" placeholder="Min ₹" min="0">
                            <span>-</span>
                            <input type="number" id="price-max" placeholder="Max ₹" min="0">
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: var(--spacing-sm); margin-top: var(--spacing-md);">
                        <button type="submit" class="btn btn-primary" style="flex: 1;">Apply</button>
                        <button type="button" id="reset-filters-btn" class="btn btn-outline" style="flex: 1;">Reset</button>
                    </div>
                </form>
            </aside>
            
            <div class="main-content">
                <!-- In-Category Product Search Bar -->
                <div class="category-search-bar" style="margin-bottom: var(--spacing-md); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 8px 12px; display: flex; gap: var(--spacing-sm); align-items: center;">
                    <div style="position: relative; flex: 1;">
                        <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-secondary); pointer-events: none; font-size: 0.95rem;">🔍</span>
                        <input type="search" id="category-product-search" class="form-input" placeholder="Search products in this category..." style="width: 100%; padding: 8px 36px 8px 36px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-bg); color: var(--color-text); font-size: 0.9rem;">
                        <button type="button" id="clear-category-search-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--color-text-secondary); cursor: pointer; display: none; font-size: 0.9rem;" title="Clear search">✕</button>
                    </div>
                    <button type="button" id="btn-category-search" class="btn btn-primary" style="padding: 0 var(--spacing-lg); height: 38px; font-size: 0.88rem; font-weight: 500;">
                        Search
                    </button>
                </div>

                <div class="sort-bar">
                    <span id="result-count-label">Showing results</span>
                    <div>
                        <label for="sort-select">Sort by:</label>
                        <select id="sort-select" class="sort-select">
                            <option value="relevance">Relevance</option>
                            <option value="discount">🔥 Biggest Discount (% Off)</option>
                            <option value="savings">💰 Highest Savings (₹ Off)</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="rating">Highest Rated</option>
                            <option value="name-asc">Name: A to Z</option>
                            <option value="name-desc">Name: Z to A</option>
                        </select>
                    </div>
                </div>
                
                <div id="category-results" class="product-grid">
                    <!-- Products rendered here -->
                </div>

                <!-- Dynamic Pagination Container -->
                <div id="pagination-container" class="pagination-container">
                    <!-- Pagination buttons rendered here -->
                </div>
            </div>
        </div>
    </main>
    <footer id="app-footer"></footer>
    <script type="module" src="/js/pages/category.js?v=2.4"></script>
</body>
</html>
