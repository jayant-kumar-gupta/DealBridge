<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — DealBridge</title>
    <meta name="description" content="Create a new DealBridge account to unlock exclusive shopping deals.">
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <header id="app-header"></header>
    <main class="auth-page">
        <div class="auth-card card">
            <div class="auth-card__logo" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: var(--space-lg);">
                <img src="/assets/images/logo.jpg" alt="DealBridge Logo" width="36" height="36" style="border-radius: 8px;">
                <span style="font-size: var(--font-size-2xl); font-weight: bold; color: var(--color-text);">DealBridge</span>
            </div>
            <h1 class="auth-card__title">Create Account</h1>
            <p class="auth-card__subtitle">Join us and start finding great partner deals today.</p>
            <form id="register-form" action="javascript:void(0);">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" id="name" class="form-input" placeholder="Enter your full name" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" id="phone" class="form-input" placeholder="+91 98765 43210" required autocomplete="tel">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Create a strong password" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm-password" class="form-input" placeholder="Confirm your password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: var(--space-lg);">Create Account</button>
            </form>
            <div class="auth-divider">or</div>
            <div class="auth-card__footer">
                Already have an account? <a href="/login.html" style="color: var(--color-primary); font-weight: 500;">Sign in</a>
            </div>
        </div>
    </main>
    <footer id="app-footer"></footer>
    <script type="module" src="/js/pages/auth-page.js"></script>
</body>
</html>
