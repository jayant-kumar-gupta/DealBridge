<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="View your latest notifications.">
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <header id="app-header"></header>
    <main class="sidebar-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li class="sidebar-nav__item"><a href="/profile.html">👤 Profile</a></li>
                    <li class="sidebar-nav__item"><a href="/orders.html">📦 Orders</a></li>
                    <li class="sidebar-nav__item"><a href="/wishlist.html">❤️ Wishlist</a></li>
                    <li class="sidebar-nav__item"><a href="/addresses.html">📍 Addresses</a></li>
                    <li class="sidebar-nav__item"><a href="/promo-codes.html">🎟️ Promo Codes</a></li>
                    <li class="sidebar-nav__item"><a href="/notifications.html" class="active">🔔 Notifications</a></li>
                    <li class="sidebar-nav__item"><a href="#" id="logout-btn">🚪 Logout</a></li>
                </ul>
            </nav>
        </aside>
        <div class="dashboard-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
                <h1>Notifications</h1>
                <button class="btn btn--outline btn--sm" id="mark-all-btn">Mark All as Read</button>
            </div>
            
            <div id="notifications-list" style="display: flex; flex-direction: column; gap: var(--spacing-sm);">
                <!-- Populated by JS -->
            </div>
            
            <div id="empty-state" class="empty-state" style="display: none; text-align: center; padding: var(--spacing-3xl) 0;">
                <div style="font-size: 3rem; margin-bottom: var(--spacing-md);">🔕</div>
                <h3>No notifications</h3>
                <p style="color: var(--color-text-secondary);">You're all caught up!</p>
            </div>
        </div>
    </main>
    <footer id="app-footer"></footer>
    <script type="module" src="/js/pages/notifications-page.js"></script>
