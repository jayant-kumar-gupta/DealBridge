<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — DealBridge</title>
    <meta name="description" content="Login to your DealBridge account to access exclusive partner deals.">
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <header id="app-header"></header>
    <main class="auth-page">
        <div class="auth-card card">
            <div class="auth-card__logo" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: var(--space-lg);">
                <img src="/assets/images/logo.jpg" alt="DealBridge Logo" width="36" height="36" style="border-radius: 8px;">
                <span style="font-size: var(--font-size-2xl); font-weight: bold; color: var(--color-text);">DealBridge</span>
            </div>
            <h1 class="auth-card__title">Welcome Back</h1>
            <p class="auth-card__subtitle">Please enter your details to sign in.</p>
            <form id="login-form" action="javascript:void(0);">
                <div class="form-group">
                    <label for="email" class="form-label">Email or Phone Number</label>
                    <input type="text" id="email" class="form-input" placeholder="Enter your email or phone number" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-lg);">
                    <label style="display: flex; align-items: center; gap: 6px; font-size: var(--font-size-sm); color: var(--color-text-secondary); cursor: pointer;">
                        <input type="checkbox" id="remember"> Remember me
                    </label>
                    <a href="/forgot-password.html" style="font-size: var(--font-size-sm); color: var(--color-primary); text-decoration: none;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-full btn-lg">Sign In</button>
            </form>
            
            <div class="auth-divider">or</div>
            
            <div class="auth-card__footer">
                Don't have an account? <a href="/register.html" style="color: var(--color-primary); font-weight: 500;">Register</a>
            </div>
        </div>
    </main>
    <footer id="app-footer"></footer>
    <script type="module" src="/js/pages/auth-page.js"></script>
</body>
</html>
