<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — DealBridge Admin</title>
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="admin-sidebar"></aside>
        <main class="admin-main">
            <header class="admin-header">
                <h1 class="page-title">Products</h1>
                <button class="btn btn-primary" id="add-product-btn">+ Add Product</button>
            </header>
            
            <div style="margin-bottom: var(--space-lg); display: flex; gap: var(--space-md);">
                <input type="text" id="product-search" class="form-input" placeholder="Search products..." style="max-width: 300px;">
                <select id="product-category-filter" class="form-select" style="max-width: 200px;">
                    <option value="">All Categories</option>
                </select>
            </div>

            <div class="admin-table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Our Deal</th>
                            <th>Stock Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script type="module" src="/js/pages/admin/products.js"></script>
</body>
</html>
