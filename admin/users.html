<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users — DealBridge Admin</title>
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="admin-sidebar"></aside>
        <main class="admin-main">
            <header class="admin-header">
                <div>
                    <h1 class="page-title">Users</h1>
                    <p style="color: var(--color-text-secondary); margin-top: 4px; font-size: var(--font-size-sm);">Manage registered customers and platform administrators</p>
                </div>
                <div style="display: flex; gap: var(--space-md); align-items: center; flex-wrap: wrap;">
                    <button class="btn btn-primary" id="add-admin-btn">
                        <span>+</span> Add Admin
                    </button>
                </div>
            </header>
            
            <div style="display: flex; gap: var(--space-md); align-items: center; justify-content: space-between; margin-bottom: var(--space-lg); flex-wrap: wrap;">
                <div style="display: flex; gap: var(--space-md); align-items: center; flex-wrap: wrap; flex: 1;">
                    <div style="position: relative; max-width: 320px; width: 100%;">
                        <input type="search" id="user-search" placeholder="Search by name, email, phone, ID..." class="form-input" style="width: 100%; padding-left: 36px;">
                        <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-text-secondary); pointer-events: none;">🔍</span>
                    </div>
                    <select id="user-role-filter" class="form-input" style="max-width: 160px; cursor: pointer;">
                        <option value="">All Roles</option>
                        <option value="admin">Admins</option>
                        <option value="user">Customers</option>
                    </select>
                </div>
                <div id="users-count-badge" style="font-size: var(--font-size-sm); color: var(--color-text-secondary);">
                    Loading users...
                </div>
            </div>

            <div class="admin-table-container" style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 80px;">User ID</th>
                            <th>User</th>
                            <th>Contact</th>
                            <th style="width: 110px;">Role</th>
                            <th style="width: 130px;">Join Date</th>
                            <th style="width: 90px; text-align: center;">Orders</th>
                            <th style="width: 100px; text-align: center;">Status</th>
                            <th style="width: 170px; text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script type="module" src="/js/pages/admin/users.js"></script>
</body>
</html>
