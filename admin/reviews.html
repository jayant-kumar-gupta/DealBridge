<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews — DealBridge Admin</title>
    <link rel="icon" href="/assets/images/logo.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar" id="admin-sidebar"></aside>
        <main class="admin-main">
            <header class="admin-header">
                <h1 class="page-title">Reviews & Comments</h1>
            </header>

            <div style="margin-bottom: var(--space-lg); display: flex; gap: var(--space-md); flex-wrap: wrap; align-items: center;">
                <input type="search" id="review-search" class="form-input" placeholder="Search comments, authors, or products..." style="max-width: 300px; padding: 8px 12px;">
                <select id="review-product-filter" class="form-select" style="max-width: 240px;">
                    <option value="">All Products</option>
                </select>
            </div>

            <div class="admin-table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 60px;">ID</th>
                            <th>Product</th>
                            <th>Author</th>
                            <th style="width: 120px;">Product Rating</th>
                            <th style="width: 130px;">Date</th>
                            <th>Comment</th>
                            <th style="width: 150px; text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="reviews-table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script type="module" src="/js/pages/admin/reviews.js"></script>
</body>
</html>
